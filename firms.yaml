# =============================================================
# Prop Firm Rules Watchdog — firm registry
#
# Each entry monitored daily for changes in published rules.
#
# Fields:
#   name      — display name shown in the dashboard
#   slug      — filename-safe identifier (lowercase, hyphens)
#   url       — full URL to the rules / ToS / prohibited-practices page
#   selector  — CSS selector for the main content; reduces noise
#   category  — informational tag (evaluation / instant / futures / hybrid)
#
# Adding a firm: open the rules page, identify the wrapping <main>,
# <article>, or top-level content <div>, and put its CSS selector here.
# When in doubt, use 'main' or 'body' and refine later if too noisy.
# =============================================================

